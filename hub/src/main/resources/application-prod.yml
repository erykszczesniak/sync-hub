# Production / docker profile: PostgreSQL; everything comes from the environment (see .env.example).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

synchub:
  events:
    transport: ${SYNCHUB_EVENTS_TRANSPORT:kafka}

logging:
  level:
    com.erykszczesniak.synchub: INFO
