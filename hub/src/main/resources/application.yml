spring:
  application:
    name: sync-hub
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 20000
        request.timeout.ms: 10000

server:
  port: ${HUB_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

synchub:
  security:
    admin:
      username: ${SYNCHUB_ADMIN_USERNAME:admin}
      password: ${SYNCHUB_ADMIN_PASSWORD:change-me}
  source:
    system-a:
      base-url: ${SYSTEM_A_BASE_URL:http://localhost:8081}
      api-key: ${SYSTEM_A_API_KEY:system-a-dev-key}
      page-size: 100
      max-pages-per-run: 100
      connect-timeout: 3s
      read-timeout: 10s
  sync:
    watermark-overlap: 5s
  events:
    transport: ${SYNCHUB_EVENTS_TRANSPORT:log}
    topic-prefix: synchub.changes
    publish-interval: 1s
    partitions: 3

# Outbound resilience for System A (retry is the outermost decorator, then circuit breaker, then rate limiter).
resilience4j:
  retry:
    instances:
      system-a:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.erykszczesniak.synchub.common.SourceUnavailableException
        ignore-exceptions:
          - com.erykszczesniak.synchub.common.SourceAuthException
          - com.erykszczesniak.synchub.common.SourceResponseException
  ratelimiter:
    instances:
      system-a:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 5s
  circuitbreaker:
    instances:
      system-a:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.erykszczesniak.synchub.common.SourceUnavailableException
        ignore-exceptions:
          - com.erykszczesniak.synchub.common.SourceAuthException
          - com.erykszczesniak.synchub.common.SourceResponseException

logging:
  level:
    com.erykszczesniak.synchub: INFO
