# Local development profile: embedded H2 (file-based, survives restarts), no external services.
spring:
  datasource:
    url: jdbc:h2:file:./h2-data/synchub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.erykszczesniak.synchub: DEBUG
