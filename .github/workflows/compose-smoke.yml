name: compose smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "scripts/**"
      - ".github/workflows/compose-smoke.yml"

jobs:
  demo:
    name: build the stack and run the demo scenario
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        # The demo triggers syncs itself; a concurrent scheduler would make its exact counts racy.
        run: SYNCHUB_SYNC_SCHEDULED=false docker compose up --build -d
      - name: Wait for the hub
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs hub | tail -100
          exit 1
      - name: Run the scripted demo
        run: ./scripts/demo.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Stop the stack
        if: always()
        run: docker compose down -v
