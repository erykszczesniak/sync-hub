# The whole sync-hub demo: PostgreSQL (System B + hub state), Kafka (change events), the System A
# simulator (source), the hub and the dashboard. `docker compose up --build` and open http://localhost:5173.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synchub
      POSTGRES_USER: synchub
      POSTGRES_PASSWORD: synchub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synchub -d synchub"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners: one for containers on the
    # compose network (kafka:9092) and one for tools on the host (localhost:29092).
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: c3luYy1odWItZGVtby1jbHVzdGVy
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  system-a-sim:
    build:
      context: .
      dockerfile: system-a-sim/Dockerfile
    environment:
      SYSTEM_A_API_KEY: ${SYSTEM_A_API_KEY:-system-a-dev-key}
    ports:
      - "${SYSTEM_A_PORT:-8081}:8081"

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      system-a-sim:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/synchub
      SPRING_DATASOURCE_USERNAME: synchub
      SPRING_DATASOURCE_PASSWORD: synchub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SYNCHUB_EVENTS_TRANSPORT: kafka
      SYSTEM_A_BASE_URL: http://system-a-sim:8081
      SYSTEM_A_API_KEY: ${SYSTEM_A_API_KEY:-system-a-dev-key}
      SYNCHUB_ADMIN_USERNAME: ${SYNCHUB_ADMIN_USERNAME:-admin}
      SYNCHUB_ADMIN_PASSWORD: ${SYNCHUB_ADMIN_PASSWORD:-change-me}
      SYNCHUB_SYNC_INTERVAL: ${SYNCHUB_SYNC_INTERVAL:-30s}
    ports:
      - "${HUB_PORT:-8080}:8080"

  dashboard:
    build: ./dashboard
    depends_on:
      - hub
    environment:
      HUB_UPSTREAM: hub:8080
    ports:
      - "${DASHBOARD_PORT:-5173}:8080"

volumes:
  pgdata:
